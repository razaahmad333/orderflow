apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: orderflow
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: orderflow
spec:
  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
        app.kubernetes.io/part-of: orderflow

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: orders-service
          image: __ORDERFLOW_IMAGE__
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: orders-service-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-data
              mountPath: /tmp

      volumes:
        - name: temporary-data
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi

---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: orderflow
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: orderflow
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: orders-service

  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
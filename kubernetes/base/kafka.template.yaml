apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: orderflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: orderflow
spec:
  clusterIP: None
  publishNotReadyAddresses: true

  selector:
    app.kubernetes.io/name: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker
      protocol: TCP

    - name: controller
      port: 9093
      targetPort: controller
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: orderflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: orderflow
spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: broker
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: orderflow
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: orderflow
spec:
  serviceName: kafka-headless
  replicas: 1

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app.kubernetes.io/name: kafka

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: orderflow

    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: broker
              containerPort: 9092
              protocol: TCP

            - name: controller
              containerPort: 9093
              protocol: TCP

          env:
            - name: CLUSTER_ID
              value: "__KAFKA_CLUSTER_ID__"

            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: broker,controller

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093

            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: >-
                1@kafka-0.kafka-headless.orderflow.svc.cluster.local:9093

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT

            - name: KAFKA_LOG_DIRS
              value: /tmp/kafka-logs

            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"

            - name: KAFKA_NUM_PARTITIONS
              value: "3"

            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  /opt/kafka/bin/kafka-broker-api-versions.sh
                  --bootstrap-server localhost:9092
                  >/dev/null 2>&1
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  /opt/kafka/bin/kafka-broker-api-versions.sh
                  --bootstrap-server localhost:9092
                  >/dev/null 2>&1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: kafka-data
              mountPath: /tmp/kafka-logs

  volumeClaimTemplates:
    - metadata:
        name: kafka-data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/part-of: orderflow

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 2Gi
apiVersion: batch/v1
kind: Job
metadata:
  name: orders-db-migrate
  namespace: orderflow
  labels:
    app.kubernetes.io/name: orders-db-migrate
    app.kubernetes.io/part-of: orderflow
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-db-migrate
        app.kubernetes.io/part-of: orderflow

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: migrator
          image: __ORDERFLOW_IMAGE__
          imagePullPolicy: Never

          command:
            - node
            - dist/scripts/migrate-container.js

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: DATABASE_URL

            - name: MIGRATIONS_DIRECTORY
              value: /app/database/migrations

            - name: LOG_LEVEL
              value: info

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: temporary-data
              mountPath: /tmp

      volumes:
        - name: temporary-data
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
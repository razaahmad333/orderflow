name: orderflow

services:
  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 2s
      retries: 10
  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow-dev

    ports:
      - "5433:5432"

    volumes:
      - orderflow-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U orderflow -d orderflow
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 5s

  orders-service:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile

    environment:
      NODE_ENV: production
      SERVICE_NAME: orders-service
      PORT: 3000
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 10000

      DATABASE_URL: postgresql://orderflow:orderflow-dev@postgres:5432/orderflow
      DB_POOL_MAX: 10
      DB_CONNECT_TIMEOUT_MS: 2000
      DB_HEALTHCHECK_INTERVAL_MS: 2000
      ORDER_TRANSACTION_HOLD_MS: 0
      TRANSACTION_MAX_ATTEMPTS: 3
      TRANSACTION_RETRY_BASE_DELAY_MS: 50
      TRANSACTION_LOCK_TIMEOUT_MS: 1000
      TRANSACTION_STATEMENT_TIMEOUT_MS: 5000

      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: 1000
      PRODUCT_CACHE_TTL_SECONDS: 60

      PRODUCT_CACHE_LOCK_TTL_MS: 3000
      PRODUCT_CACHE_LOCK_WAIT_MS: 1000
      PRODUCT_CACHE_LOCK_POLL_MS: 50

      CACHE_INVALIDATION_POLL_MS: 2000
      CACHE_INVALIDATION_BATCH_SIZE: 20
      CACHE_INVALIDATION_LOCK_MS: 30000

      BACKGROUND_JOB_POLL_MS: 1000
      BACKGROUND_JOB_BATCH_SIZE: 20
      BACKGROUND_JOB_LOCK_MS: 30000

      NOTIFICATION_JOB_ATTEMPTS: 3
      NOTIFICATION_JOB_BACKOFF_MS: 1000
      NOTIFICATION_WORKER_CONCURRENCY: 5

      SIMULATE_NOTIFICATION_FAILURES: 0

      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: orders-service
      KAFKA_ORDER_CREATED_TOPIC: order.created.v1
      
    ports:
      - "3000:3000"

    init: true

    stop_grace_period: 15s

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:3000/health/ready
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 5s
  
  job-dispatcher:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile

    command:
      - node
      - dist/workers/job-dispatcher.js

    environment:
      NODE_ENV: production
      SERVICE_NAME: job-dispatcher
      PORT: 3001
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 10000

      DATABASE_URL: postgresql://orderflow:orderflow-dev@postgres:5432/orderflow
      DB_POOL_MAX: 5
      DB_CONNECT_TIMEOUT_MS: 2000
      DB_HEALTHCHECK_INTERVAL_MS: 2000

      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: 1000
      PRODUCT_CACHE_TTL_SECONDS: 60
      PRODUCT_CACHE_LOCK_TTL_MS: 3000
      PRODUCT_CACHE_LOCK_WAIT_MS: 1000
      PRODUCT_CACHE_LOCK_POLL_MS: 50

      TRANSACTION_MAX_ATTEMPTS: 3
      TRANSACTION_RETRY_BASE_DELAY_MS: 50
      TRANSACTION_LOCK_TIMEOUT_MS: 1000
      TRANSACTION_STATEMENT_TIMEOUT_MS: 5000
      ORDER_TRANSACTION_HOLD_MS: 0

      CACHE_INVALIDATION_POLL_MS: 2000
      CACHE_INVALIDATION_BATCH_SIZE: 20
      CACHE_INVALIDATION_LOCK_MS: 30000

      BACKGROUND_JOB_POLL_MS: 1000
      BACKGROUND_JOB_BATCH_SIZE: 20
      BACKGROUND_JOB_LOCK_MS: 30000

      NOTIFICATION_JOB_ATTEMPTS: 3
      NOTIFICATION_JOB_BACKOFF_MS: 1000
      NOTIFICATION_WORKER_CONCURRENCY: 5
      SIMULATE_NOTIFICATION_FAILURES: 0

      KAFKA_BROKERS: kafka:9092

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      kafka:
        condition: service_healthy

    restart: unless-stopped

  notification-worker:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile

    command:
      - node
      - dist/workers/notification-worker.js

    environment:
      NODE_ENV: production
      SERVICE_NAME: notification-worker
      PORT: 3002
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 10000

      DATABASE_URL: postgresql://orderflow:orderflow-dev@postgres:5432/orderflow
      DB_POOL_MAX: 5
      DB_CONNECT_TIMEOUT_MS: 2000
      DB_HEALTHCHECK_INTERVAL_MS: 2000

      REDIS_URL: redis://redis:6379
      REDIS_CONNECT_TIMEOUT_MS: 1000
      PRODUCT_CACHE_TTL_SECONDS: 60
      PRODUCT_CACHE_LOCK_TTL_MS: 3000
      PRODUCT_CACHE_LOCK_WAIT_MS: 1000
      PRODUCT_CACHE_LOCK_POLL_MS: 50

      TRANSACTION_MAX_ATTEMPTS: 3
      TRANSACTION_RETRY_BASE_DELAY_MS: 50
      TRANSACTION_LOCK_TIMEOUT_MS: 1000
      TRANSACTION_STATEMENT_TIMEOUT_MS: 5000
      ORDER_TRANSACTION_HOLD_MS: 0

      CACHE_INVALIDATION_POLL_MS: 2000
      CACHE_INVALIDATION_BATCH_SIZE: 20
      CACHE_INVALIDATION_LOCK_MS: 30000

      BACKGROUND_JOB_POLL_MS: 1000
      BACKGROUND_JOB_BATCH_SIZE: 20
      BACKGROUND_JOB_LOCK_MS: 30000

      NOTIFICATION_JOB_ATTEMPTS: 3
      NOTIFICATION_JOB_BACKOFF_MS: 1000
      NOTIFICATION_WORKER_CONCURRENCY: 5

      SIMULATE_NOTIFICATION_FAILURES: 0

      SIMULATE_NOTIFICATION_CRASH_AFTER_SEND: 0

      KAFKA_BROKERS: kafka:9092

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: >-
        broker,controller

      KAFKA_LISTENERS: >-
        PLAINTEXT://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: >-
        CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: >-
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:9092
          --list >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  notification-kafka-worker:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile

    command:
      - node
      - dist/workers/notification-worker.kafka.js

    environment:
      DATABASE_URL: >-
        postgresql://orderflow:orderflow-dev@postgres:5432/orderflow

      LOG_LEVEL: info

      KAFKA_BROKERS: kafka:9092
      KAFKA_ORDER_CREATED_TOPIC: order.created.v1
      KAFKA_ORDER_CREATED_DLQ_TOPIC: order.created.v1.dlq
      KAFKA_ORDER_CREATED_RETRY_TOPIC: order.created.v1.retry.10s
      KAFKA_RETRY_DELAY_MS: 10000
      KAFKA_NOTIFICATION_GROUP_ID: notification-service-v1

    init: true
    stop_grace_period: 15s

    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
  order-outbox-publisher:
    build:
      context: ./services/orders-service
      dockerfile: Dockerfile

    command:
      - node
      - dist/workers/order-outbox-publisher.js

    environment:
      DATABASE_URL: >-
        postgresql://orderflow:orderflow-dev@postgres:5432/orderflow

      KAFKA_BROKERS: kafka:9092
      KAFKA_OUTBOX_POLL_MS: 1000
      KAFKA_OUTBOX_BATCH_SIZE: 20
      KAFKA_OUTBOX_LOCK_MS: 30000

    init: true
    stop_grace_period: 15s

    depends_on:
      postgres:
        condition: service_healthy

      kafka:
        condition: service_healthy
volumes:
  orderflow-postgres-data:
